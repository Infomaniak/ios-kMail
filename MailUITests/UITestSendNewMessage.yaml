appId: com.infomaniak.mail
---
- launchApp:
    clearState: true

- runFlow: "subflows/onboarding.yaml"
- runFlow: "subflows/login.yaml"
- runFlow: "subflows/autorization.yaml"
- runScript: "script/setMailSubject.js"
- runScript: "script/setMailBody.js"

- extendedWaitUntil:
    visible: "Inbox"
    timeout: 30000

- runFlow: "subflows/newMessage.yaml"

- extendedWaitUntil:
    visible: ${output.subject}
    timeout: 30000

- tapOn: ${output.subject}

- extendedWaitUntil:
    visible: ${".*" + output.body + ".*"}
    timeout: 10000

- tapOn:
    id: "BackButton"

- runFlow: "subflows/deleteMail.yaml"

- stopApp



