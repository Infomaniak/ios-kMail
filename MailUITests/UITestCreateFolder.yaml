appId: com.infomaniak.mail
---
- launchApp:
    clearState: true

- runFlow: "subflows/onboarding.yaml"
- runFlow: "subflows/login.yaml"
- runFlow: "subflows/autorization.yaml"
- runScript: "script/setFolderName.js"

- extendedWaitUntil:
    visible: "Inbox"
    timeout: 30000

- tapOn: "Menu"
- tapOn: "New folder"

- tapOn: "Name of the folder"
- inputText: ${output.folderName}

- tapOn: "Create"

- scrollUntilVisible:
    element:
      text: ${output.folderName}
    direction: DOWN
    speed: 100
    visibilityPercentage: 50
    timeout: 20000

- assertVisible: ${output.folderName}

- longPressOn: ${output.folderName}
- tapOn: "Delete"
- tapOn: "Confirm"

- stopApp



