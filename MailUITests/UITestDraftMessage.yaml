appId: com.infomaniak.mail
---
- launchApp:
    clearState: true
    arguments:
      skipLogin: "true"
      UITEST_TOKEN: ${MAESTRO_TOKEN}
      UITEST_USER_ID: ${MAESTRO_USER_ID}

- runFlow: "subflows/autorization.yaml"
- runScript: "script/setMailBody.js"

- extendedWaitUntil:
    visible: "Inbox"
    timeout: 30000

- runFlow: "subflows/newDraft.yaml"

- tapOn: "Menu"
- tapOn: "Drafts"

- extendedWaitUntil:
    visible: ${".*" + output.body + ".*"}
    timeout: 30000

- tapOn: ${".*" + output.body + ".*"}

- extendedWaitUntil:
    visible: ${".*" + output.body + ".*"}
    timeout: 10000

- tapOn: "Close"

- runFlow: "subflows/deleteMailByBody.yaml"

- stopApp