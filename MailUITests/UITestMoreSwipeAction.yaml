appId: com.infomaniak.mail
---
- launchApp:
    clearState: true

- runFlow: "subflows/onboarding.yaml"
- runFlow: "subflows/login.yaml"
- runFlow: "subflows/autorization.yaml"
- runScript: "script/setMailSubject.js"

- extendedWaitUntil:
    visible: "Inbox"
    timeout: 30000

- runFlow: "subflows/newMessage.yaml"

- assertVisible: ${".*" + output.subject + ".*"}

- swipe:
    from:
      text: ${".*" + output.subject + ".*"}
    direction: LEFT

- tapOn: "Quick actions menu"

- assertVisible: "Reply"

- stopApp