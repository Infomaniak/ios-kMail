appId: com.infomaniak.mail
---
- tapOn: "New message"

- runFlow:
    when:
      visible: "Later"
    commands:
      - tapOn: "Later"

- tapOn: "To:"
- inputText: "${MAESTRO_USER}"
- tapOn: ${"John Appleseed," + ".*"}


- tapOn: "Subject:"
- inputText: "${output.subject}"

- tapOn: "Add an attachment"
- tapOn: "Photo and video gallery"

- tapOn:
    id: "PXGGridLayout-Info"

- tapOn: "Done"

- assertVisible: "image-file"

- tapOn: "Cancel"

- runFlow:
    when:
      visible: "Later"
    commands:
      - tapOn: "Later"