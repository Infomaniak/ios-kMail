appId: com.infomaniak.mail
---
- launchApp:
    clearState: true
    arguments:
      skipLogin: "true"
      UITEST_TOKEN: ${MAESTRO_TOKEN}
      UITEST_USER_ID: ${MAESTRO_USER_ID}

- runFlow: "subflows/autorization.yaml"

- extendedWaitUntil:
    visible: "Inbox"
    timeout: 30000

- tapOn: "Menu"
- tapOn: "Settings"

- scrollUntilVisible:
    element:
      text: "Message display mode"
    direction: DOWN
    speed: 100
    visibilityPercentage: 50
    timeout: 20000

- assertVisible: "Message display mode, Discussions"
- tapOn: "Message display mode, Discussions"
- tapOn: "Messages"
- tapOn: "Confirm"
- tapOn:
    id: "BackButton"
- assertVisible: "Message display mode, Messages"
- tapOn: "Message display mode, Messages"
- tapOn: "Discussions"
- tapOn: "Confirm"
- tapOn:
    id: "BackButton"
- assertVisible: "Message display mode, Discussions"

- stopApp

