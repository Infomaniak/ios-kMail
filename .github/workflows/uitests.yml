name: UI Tests

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: UI Tests
    runs-on: [ self-hosted, iOS ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
        with:
          cache: false
      - name: Create test env
        env:
          ENV_PATH: "MailUITests/Env.swift"
          UITEST_ACCOUNT_EMAIL: ${{ secrets.UITEST_ACCOUNT_EMAIL }}
          UITEST_ACCOUNT_PASSWORD: ${{ secrets.UITEST_ACCOUNT_PASSWORD }}
        run: |
          touch $ENV_PATH
          echo -e "enum Env {\n static let testAccountEmail = \"$UITEST_ACCOUNT_EMAIL\"\n static let testAccountPassword = \"$UITEST_ACCOUNT_PASSWORD\"\n}" > $ENV_PATH
      - name: Setup
        run: tuist install && tuist generate
      - name: UITest
        run: tuist test Mail-Workspace --device "iPhone 17 Pro" --test-targets "MailUITests/MailUITests" --no-selective-testing --clean

